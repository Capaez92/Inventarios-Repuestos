{% extends "base.html" %}

{% block title %}Mi Perfil{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card shadow-sm">
            <div class="card-header bg-white py-3">
                <h5 class="card-title mb-0 fw-bold"><i class="bi bi-person-gear me-2 text-primary"></i>Configuración de Perfil</h5>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label text-muted">Nombre de Usuario</label>
                        <input type="text" class="form-control bg-light" value="{{ current_user.username }}" readonly disabled>
                        <small class="text-muted">El nombre de usuario no se puede modificar.</small>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-muted">Rol en el Sistema</label>
                        <input type="text" class="form-control bg-light" value="{{ current_user.role|capitalize }}" readonly disabled>
                    </div>

                    <div class="mb-3">
                        <label for="full_name" class="form-label">Nombre Completo</label>
                        <input type="text" class="form-control" id="full_name" name="full_name" value="{{ current_user.full_name }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Correo Electrónico</label>
                        <input type="email" class="form-control" id="email" name="email" value="{{ current_user.email or '' }}">
                    </div>

                    <hr class="my-4 text-muted">

                    <h6 class="fw-semibold mb-3"><i class="bi bi-key me-2 text-warning"></i>Cambiar Contraseña (opcional)</h6>

                    <div class="mb-3">
                        <label for="new_password" class="form-label">Nueva Contraseña</label>
                        <input type="password" class="form-control" id="new_password" name="new_password" placeholder="Dejar en blanco para mantener la actual">
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a href="{{ url_for('dashboard.index') }}" class="btn btn-soft">Cancelar</a>
                        <button type="submit" class="btn btn-primary px-4"><i class="bi bi-save me-1"></i> Guardar Cambios</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
